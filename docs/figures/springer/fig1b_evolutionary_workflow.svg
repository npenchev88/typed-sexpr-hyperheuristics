<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="174mm" height="89.7mm" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="392" fill="#ffffff"/>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="286" y="14" width="252" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="412.0" y="33.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Select &amp; Vary Next Batch (32 Slots)</text>
  <text x="412.0" y="46.0" font-size="7.8" fill="#222222" text-anchor="middle">Binary tournament (k=2); crossover p=0.5 / mut</text>
  <polyline points="286,37 254,37 254,124" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="14" y="105" width="76" height="38" rx="18" ry="18" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="52.0" y="120.5" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Start</text>
  <text x="52.0" y="132.5" font-size="7.8" fill="#222222" text-anchor="middle">Seed 0–29</text>
  <polyline points="90,124 108,124" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="110" y="101" width="128" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="174.0" y="120.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Gen 0 (Slots 0–31)</text>
  <text x="174.0" y="133.0" font-size="7.8" fill="#222222" text-anchor="middle">Sample v2 prior ASTs</text>
  <polyline points="238,124 270,124" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="272" y="101" width="140" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="342.0" y="120.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Static Validator</text>
  <text x="342.0" y="133.0" font-size="7.8" fill="#222222" text-anchor="middle">6 Roles, Effects, ≤128 nodes</text>
  <polyline points="412,124 438,124" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <polygon points="492,97 544,124 492,151 440,124" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="492" y="124" font-size="8.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Valid AST?</text>
  <text x="560" y="118" font-size="8" font-weight="700" fill="#000000" text-anchor="middle">Yes</text>
  <polyline points="544,124 576,124" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <polyline points="492,151 492,167" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <text x="472" y="161" font-size="7.5" fill="#111111" text-anchor="middle">No (>10)</text>
  <rect x="428" y="169" width="128" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="492.0" y="179.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Parent Fallback</text>
  <text x="492.0" y="192.0" font-size="7.8" fill="#222222" text-anchor="middle">Consumes 1 outer slot</text>
  <polyline points="556,183 602,183 602,149" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="578" y="101" width="138" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="647.0" y="120.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Train Evaluation</text>
  <text x="647.0" y="133.0" font-size="7.8" fill="#222222" text-anchor="middle">6 Train inst. × 2 seeds</text>
  <polyline points="647,147 647,175" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <polygon points="647,177 699,204 647,231 595,204" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="647" y="204" font-size="8.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Batch &lt; 7?</text>
  <text x="722" y="199" font-size="8" font-weight="700" fill="#000000" text-anchor="middle">Yes</text>
  <polyline points="699,204 744,204 744,37 540,37" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <text x="672" y="245" font-size="8" font-weight="700" fill="#000000" text-anchor="middle">No (256)</text>
  <polyline points="647,231 647,255" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="562" y="257" width="172" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="648.0" y="275.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Validation (Pick Top-1)</text>
  <text x="648.0" y="288.0" font-size="7.8" fill="#222222" text-anchor="middle">Top-8 Train → 6 Val × 2 seeds</text>
  <polyline points="647,301 647,325" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="562" y="327" width="172" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="648.0" y="345.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Frozen Held-Out Test</text>
  <text x="648.0" y="358.0" font-size="7.8" fill="#222222" text-anchor="middle">Single-shot 24 Test × 10 seeds</text>
  <polyline points="562,349 532,349" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="356" y="327" width="174" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="443.0" y="345.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Statistical Analysis</text>
  <text x="443.0" y="358.0" font-size="7.8" fill="#222222" text-anchor="middle">10k Bootstrap &amp; Holm (α=0.05)</text>
  <polyline points="356,349 324,349" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="234" y="330" width="88" height="38" rx="18" ry="18" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="278.0" y="345.5" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">End</text>
  <text x="278.0" y="357.5" font-size="7.8" fill="#222222" text-anchor="middle">Final Fronts</text>
  <rect x="14" y="212" width="516" height="102" fill="#f7f7f7" stroke="#333333" stroke-width="0.9" stroke-dasharray="4,3"/>
  <text x="24" y="229" font-size="8.8" font-weight="700" fill="#000000">Inside Each Train, Validation &amp; Test Run: Base-Level Bounded Interpreter</text>
  <rect x="24" y="244" width="106" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="77.0" y="265.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">1. Initialize</text>
  <text x="77.0" y="278.0" font-size="7.8" fill="#222222" text-anchor="middle">:random / :first</text>
  <polyline points="130,269 148,269" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="150" y="244" width="126" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="213.0" y="265.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">2. Search / Step</text>
  <text x="213.0" y="278.0" font-size="7.8" fill="#222222" text-anchor="middle">B ≤ 256, steps ≤ 4,096</text>
  <polyline points="276,269 294,269" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="296" y="244" width="114" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="353.0" y="265.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">3. Cache Check</text>
  <text x="353.0" y="278.0" font-size="7.8" fill="#222222" text-anchor="middle">Hit charges 1 prop.</text>
  <polyline points="410,269 428,269" fill="none" stroke="#111111" stroke-width="1.0" marker-end="url(#flow-arrow)"/>
  <rect x="430" y="244" width="90" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.0"/>
  <text x="475.0" y="265.0" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">4. Pareto HV</text>
  <text x="475.0" y="278.0" font-size="7.8" fill="#222222" text-anchor="middle">2D Archive</text>
</svg>
