<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="174mm" height="66.4mm" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="14" y="16" width="232" height="258" fill="#ffffff" stroke="#000000" stroke-width="0.9"/>
  <line x1="14" y1="38" x2="246" y2="38" stroke="#000000" stroke-width="0.7"/>
  <text x="130" y="31" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">(a) Typed S-Expression DSL (6 Roles)</text>
  <text x="22" y="56" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:operation</text>
  <text x="88" y="56" font-size="8" fill="#222222">(seq | repeat | if | search | step)</text>
  <text x="22" y="77" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:predicate</text>
  <text x="88" y="77" font-size="8" fill="#222222">(archive-changed | budget-left | less)</text>
  <text x="22" y="98" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:score</text>
  <text x="88" y="98" font-size="8" fill="#222222">(add | multiply | feature | constant)</text>
  <text x="22" y="119" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:count</text>
  <text x="88" y="119" font-size="8" fill="#222222">Loop bounds {2, 4, 8, 12, 16, 24, 32, 64}</text>
  <text x="22" y="140" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:initializer</text>
  <text x="88" y="140" font-size="8" fill="#222222">(:random | :first)</text>
  <text x="22" y="161" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#000000">:operator</text>
  <text x="88" y="161" font-size="8" fill="#222222">(:swap | :restart | :insert | :reverse)</text>
  <line x1="22" y1="182" x2="238" y2="182" stroke="#cccccc" stroke-width="0.7"/>
  <text x="22" y="196" font-size="8.5" font-weight="700" fill="#000000">Quoted Program Tree (Code as Data):</text>
  <text x="22" y="211" xml:space="preserve" font-size="8" font-family="Consolas, monospace" fill="#111111">'(:program :scheduling</text>
  <text x="22" y="224" xml:space="preserve" font-size="8" font-family="Consolas, monospace" fill="#111111">  (:budget (:seq</text>
  <text x="22" y="237" xml:space="preserve" font-size="8" font-family="Consolas, monospace" fill="#111111">    (:initialize (:initializer :first))</text>
  <text x="22" y="250" xml:space="preserve" font-size="8" font-family="Consolas, monospace" fill="#111111">    (:repeat (:count 32) (:search (:count 8)</text>
  <text x="22" y="263" xml:space="preserve" font-size="8" font-family="Consolas, monospace" fill="#111111">      (:operator :insert) &lt;score-expr&gt;)))))</text>
  <line x1="246" y1="145" x2="270" y2="145" stroke="#000000" stroke-width="1.0" marker-end="url(#arrow)"/>
  <rect x="272" y="16" width="224" height="258" fill="#ffffff" stroke="#000000" stroke-width="0.9"/>
  <line x1="272" y1="38" x2="496" y2="38" stroke="#000000" stroke-width="0.7"/>
  <text x="384" y="31" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">(b) Meta-Evolution &amp; Interpreter</text>
  <rect x="282" y="48" width="204" height="96" fill="#ffffff" stroke="#555555" stroke-width="0.7"/>
  <text x="290" y="63" font-size="9" font-weight="700" fill="#000000">Outer Meta-Evolution (30 Seeds)</text>
  <text x="290" y="78" font-size="8.5" fill="#111111">• 256 candidate programs / seed</text>
  <text x="290" y="93" font-size="8.5" fill="#111111">• 32 initial + 7 × 32 offspring batches</text>
  <text x="290" y="108" font-size="8.5" fill="#111111">• Role-safe mutation &amp; subtree crossover</text>
  <text x="290" y="123" font-size="8.5" fill="#111111">• Train (6) → Val (6) → Frozen Test (24)</text>
  <rect x="282" y="156" width="204" height="106" fill="#ffffff" stroke="#555555" stroke-width="0.7"/>
  <text x="290" y="171" font-size="9" font-weight="700" fill="#000000">Base-Level Restricted Interpreter</text>
  <text x="290" y="186" font-size="8.5" fill="#111111">• Budget: B = 256 proposals, 4,096 steps</text>
  <text x="290" y="201" font-size="8.5" fill="#111111">• Cache hits still charge 1 proposal</text>
  <text x="290" y="216" font-size="8.5" fill="#111111">• Non-dominated Pareto archive update</text>
  <text x="290" y="231" font-size="8.5" fill="#111111">• Normalized 2D Hypervolume in [0, 1]</text>
  <text x="290" y="246" font-size="8.5" fill="#111111">• Wall-clock runtime recorded (ms / s)</text>
  <line x1="496" y1="80" x2="522" y2="80" stroke="#000000" stroke-width="1.0" marker-end="url(#arrow)"/>
  <line x1="496" y1="210" x2="522" y2="210" stroke="#000000" stroke-width="1.0" marker-end="url(#arrow)"/>
  <rect x="524" y="16" width="222" height="120" fill="#ffffff" stroke="#000000" stroke-width="0.9"/>
  <line x1="524" y1="38" x2="746" y2="38" stroke="#000000" stroke-width="0.7"/>
  <text x="635" y="31" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">(c) Domain 1: NASDAQ-50 Portfolio</text>
  <text x="532" y="54" font-size="8.5" fill="#111111">• 50 NASDAQ stocks (2012–2026)</text>
  <text x="532" y="69" font-size="8.5" fill="#111111">• Exact-K subset (K = 5, T = 90 days)</text>
  <text x="532" y="84" font-size="8.5" fill="#111111">• Objectives: (-mean return, daily risk)</text>
  <text x="532" y="99" font-size="8.5" fill="#111111">• Operators: {:swap, :restart}</text>
  <text x="532" y="114" font-size="8.5" fill="#111111">• 6 Train / 6 Val / 24 Test quarters</text>
  <rect x="524" y="154" width="222" height="120" fill="#ffffff" stroke="#000000" stroke-width="0.9"/>
  <line x1="524" y1="176" x2="746" y2="176" stroke="#000000" stroke-width="0.7"/>
  <text x="635" y="169" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">(d) Domain 2: OR-Library Scheduling</text>
  <text x="532" y="192" font-size="8.5" fill="#111111">• Beasley OR-Library wt40 (40 jobs)</text>
  <text x="532" y="207" font-size="8.5" fill="#111111">• Single-machine job permutations</text>
  <text x="532" y="222" font-size="8.5" fill="#111111">• Objectives: (mean completion, tardiness)</text>
  <text x="532" y="237" font-size="8.5" fill="#111111">• Operators: {:swap, :restart, :insert, :reverse}</text>
  <text x="532" y="252" font-size="8.5" fill="#111111">• Initializers: {:first (SPT), :random}</text>
</svg>
