<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 310" width="174mm" height="72.9mm" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="740" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222222"/>
    </marker>
  </defs>

  <!-- Left Box: Quoted Homoiconic S-expression (Code as Data) -->
  <rect x="14" y="18" width="255" height="274" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
  <line x1="14" y1="42" x2="269" y2="42" stroke="#222222" stroke-width="0.7"/>
  <text x="141" y="34" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Quoted S-Expression (Code as Data)</text>

  <text x="24" y="64" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#111111">'(:program :portfolio</text>
  <text x="24" y="80" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#111111">  (:budget</text>
  <text x="24" y="96" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#111111">    (:seq</text>
  <text x="24" y="112" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#1f77b4">      (:initialize</text>
  <text x="24" y="128" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#1f77b4">        (:initializer :random))</text>
  <text x="24" y="144" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#111111">      (:repeat (:count 24)</text>
  <text x="24" y="160" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#111111">        (:search (:count 24)</text>
  <text x="24" y="176" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#1f77b4">          (:operator :swap)</text>
  <text x="24" y="192" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#2ca02c">          (:add</text>
  <text x="24" y="208" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#2ca02c">            (:feature :objective-0)</text>
  <text x="24" y="224" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#2ca02c">            (:multiply</text>
  <text x="24" y="240" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#2ca02c">              (:feature :progress)</text>
  <text x="24" y="256" xml:space="preserve" font-size="9.5" font-family="Consolas, 'Courier New', monospace" fill="#2ca02c">              (:feature :objective-1))))))))</text>

  <text x="24" y="280" font-size="8.5" fill="#444444">Leading quote ' treats the list as a tree literal.</text>

  <!-- Isomorphism Arrow -->
  <line x1="274" y1="155" x2="306" y2="155" stroke="#222222" stroke-width="1.0" marker-end="url(#arr)"/>
  <text x="290" y="146" font-size="8.5" fill="#222222" text-anchor="middle">1:1 AST</text>

  <!-- Right Box: Typed Abstract Syntax Tree (AST) -->
  <rect x="312" y="18" width="414" height="274" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
  <line x1="312" y1="42" x2="726" y2="42" stroke="#222222" stroke-width="0.7"/>
  <text x="519" y="34" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Typed Abstract Syntax Tree (6 Syntactic Roles)</text>

  <!-- Tree Edges -->
  <!-- :seq to :initialize and :repeat -->
  <line x1="485" y1="76" x2="395" y2="104" stroke="#333333" stroke-width="0.9"/>
  <line x1="485" y1="76" x2="565" y2="104" stroke="#333333" stroke-width="0.9"/>
  <!-- :initialize to :random -->
  <line x1="395" y1="126" x2="395" y2="150" stroke="#333333" stroke-width="0.9"/>
  <!-- :repeat to :count 24 and :search -->
  <line x1="565" y1="126" x2="495" y2="150" stroke="#333333" stroke-width="0.9"/>
  <line x1="565" y1="126" x2="615" y2="150" stroke="#333333" stroke-width="0.9"/>
  <!-- :search to :count 24, :swap, and :add -->
  <line x1="615" y1="172" x2="500" y2="198" stroke="#333333" stroke-width="0.9"/>
  <line x1="615" y1="172" x2="585" y2="198" stroke="#333333" stroke-width="0.9"/>
  <line x1="615" y1="172" x2="665" y2="198" stroke="#333333" stroke-width="0.9"/>
  <!-- :add to :objective-0 and :multiply -->
  <line x1="665" y1="220" x2="590" y2="244" stroke="#333333" stroke-width="0.9"/>
  <line x1="665" y1="220" x2="680" y2="244" stroke="#333333" stroke-width="0.9"/>
  <!-- :multiply to :progress and :objective-1 -->
  <line x1="680" y1="264" x2="632" y2="274" stroke="#333333" stroke-width="0.9"/>
  <line x1="680" y1="264" x2="700" y2="274" stroke="#333333" stroke-width="0.9"/>

  <!-- Tree Nodes -->
  <!-- Root :seq -->
  <rect x="443" y="54" width="84" height="22" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
  <text x="485" y="68" font-size="8.5" font-family="Consolas, monospace" font-weight="700" fill="#111111" text-anchor="middle">:seq [:op]</text>

  <!-- Level 1: :initialize and :repeat -->
  <rect x="342" y="104" width="106" height="22" fill="#ffffff" stroke="#1f77b4" stroke-width="0.9"/>
  <text x="395" y="118" font-size="8.5" font-family="Consolas, monospace" fill="#1f77b4" text-anchor="middle">:initialize [:op]</text>

  <rect x="520" y="104" width="90" height="22" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
  <text x="565" y="118" font-size="8.5" font-family="Consolas, monospace" fill="#111111" text-anchor="middle">:repeat [:op]</text>

  <!-- Level 2: :random, :count 24, :search -->
  <rect x="345" y="150" width="100" height="22" fill="#ffffff" stroke="#1f77b4" stroke-width="0.9"/>
  <text x="395" y="164" font-size="8" font-family="Consolas, monospace" fill="#1f77b4" text-anchor="middle">:random [:init]</text>

  <rect x="455" y="150" width="82" height="22" fill="#ffffff" stroke="#555555" stroke-width="0.9"/>
  <text x="496" y="164" font-size="8" font-family="Consolas, monospace" fill="#333333" text-anchor="middle">24 [:count]</text>

  <rect x="570" y="150" width="90" height="22" fill="#ffffff" stroke="#222222" stroke-width="0.9"/>
  <text x="615" y="164" font-size="8.5" font-family="Consolas, monospace" fill="#111111" text-anchor="middle">:search [:op]</text>

  <!-- Level 3: 24 [:count], :swap [:operator], :add [:score] -->
  <rect x="462" y="198" width="76" height="22" fill="#ffffff" stroke="#555555" stroke-width="0.9"/>
  <text x="500" y="212" font-size="8" font-family="Consolas, monospace" fill="#333333" text-anchor="middle">24 [:count]</text>

  <rect x="544" y="198" width="82" height="22" fill="#ffffff" stroke="#1f77b4" stroke-width="0.9"/>
  <text x="585" y="212" font-size="8" font-family="Consolas, monospace" fill="#1f77b4" text-anchor="middle">:swap [:oper]</text>

  <rect x="631" y="198" width="76" height="22" fill="#ffffff" stroke="#2ca02c" stroke-width="0.9"/>
  <text x="669" y="212" font-size="8" font-family="Consolas, monospace" fill="#2ca02c" text-anchor="middle">:add [:score]</text>

  <!-- Level 4: :objective-0 and :multiply -->
  <rect x="538" y="244" width="92" height="20" fill="#ffffff" stroke="#2ca02c" stroke-width="0.9"/>
  <text x="584" y="257" font-size="7.5" font-family="Consolas, monospace" fill="#2ca02c" text-anchor="middle">:objective-0</text>

  <rect x="638" y="244" width="82" height="20" fill="#ffffff" stroke="#2ca02c" stroke-width="0.9"/>
  <text x="679" y="257" font-size="7.5" font-family="Consolas, monospace" fill="#2ca02c" text-anchor="middle">:multiply</text>

  <!-- Level 5: :progress and :objective-1 -->
  <text x="625" y="284" font-size="7.5" font-family="Consolas, monospace" fill="#2ca02c" text-anchor="middle">:progress</text>
  <text x="696" y="284" font-size="7.5" font-family="Consolas, monospace" fill="#2ca02c" text-anchor="middle">:objective-1</text>

  <!-- Note in bottom-left of Tree box -->
  <text x="322" y="215" font-size="8" fill="#444444">Role-preserving variation:</text>
  <text x="322" y="228" font-size="8" fill="#444444">• [:op] ↔ [:op]</text>
  <text x="322" y="240" font-size="8" fill="#444444">• [:oper] ↔ [:oper]</text>
  <text x="322" y="252" font-size="8" fill="#444444">• [:score] ↔ [:score]</text>
</svg>
