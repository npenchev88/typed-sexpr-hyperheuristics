<figure aria-label="Proposed typed optimizer experiment, showing program evolution, solution search, validation, freezing and independent testing.">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1380" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Evolve the optimizer, not just the solution</title>
<desc id="diagram-desc">Portfolios and scheduling use the same engine but separate training runs. The outer loop generates typed optimizer programs, executes each program on training tasks, assesses frontier quality and program size, then selects, mutates and crosses programs. Inside each program, the inner loop proposes solutions, scores objectives, and updates a Pareto archive under a fixed budget. Training finalists are selected using validation, then frozen and evaluated on unseen tasks. Compare against Random DSL, mutation-only, scoring-only, and configured conventional solvers, with exact references for small cases. The aim is compact programs and defensible evidence, not guaranteed investment profits. This is a proposed experiment, not a report of results.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263349" stroke-width="0.5" opacity="0.36"/></pattern>
  <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b59aef"/></marker>
  <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63debe"/></marker>
  <marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e5bd7c"/></marker>
  <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8fa0ba"/></marker>
</defs>
<rect width="1020" height="1380" fill="#0b1020"/>
<rect x="25" y="130" width="970" height="1190" fill="url(#grid)"/>

<!-- Header: statement of aim, not a claim of measured success. -->

<text class="title" x="40" y="83">Evolve the optimizer, not just the solution.</text>
<text class="subtitle" x="40" y="117">Discover small programs that learn how to search under fixed budgets.</text>

<!-- Domain adapters. -->
<rect x="40" y="155" width="446" height="120" rx="12" fill="#121b2c" stroke="#44536d" stroke-width="1.4"/>
<text class="node-title" x="64" y="192">Portfolio selection</text>
<text class="detail" x="64" y="222">Choose K assets with equal weights</text>
<text class="detail" x="64" y="251">Higher mean return · lower volatility</text>
<rect x="534" y="155" width="446" height="120" rx="12" fill="#121b2c" stroke="#44536d" stroke-width="1.4"/>
<text class="node-title" x="558" y="192">Job scheduling</text>
<text class="detail" x="558" y="222">Choose the order of jobs</text>
<text class="detail" x="558" y="251">Lower mean completion time · less tardiness</text>
<text class="small" x="510" y="309" text-anchor="middle">SAME ENGINE · DIFFERENT TASKS / OPERATORS · SEPARATE TRAINING</text>
<path class="arrow" d="M82 275V337" stroke="#8fa0ba" marker-end="url(#gray-arrow)"/>
<path class="arrow" d="M938 275V337" stroke="#8fa0ba" marker-end="url(#gray-arrow)"/>

<!-- Outer loop boundary. -->
<rect x="40" y="340" width="940" height="502" rx="16" fill="#111326" stroke="#8b70c4" stroke-width="1.7"/>
<text class="eyebrow program" x="64" y="376">1 · OUTER LOOP — EVOLVE OPTIMIZER PROGRAMS</text>

<!-- Connections behind the nodes. -->
<path class="arrow" d="M356 469H414" stroke="#b59aef" marker-end="url(#purple-arrow)"/>
<path class="arrow" d="M692 654V678H783V703" stroke="#63debe" marker-end="url(#green-arrow)"/>
<path class="arrow" d="M610 757H358" stroke="#b59aef" marker-end="url(#purple-arrow)"/>
<path class="arrow" d="M210 705V535" stroke="#b59aef" marker-end="url(#purple-arrow)"/>
<text class="small program" x="224" y="612">next generation</text>
<text class="small program" x="482" y="742" text-anchor="middle">fitness + complexity</text>

<rect x="64" y="414" width="292" height="120" rx="11" fill="#201d36" stroke="#a48bd4" stroke-width="1.4"/>
<text class="node-title" x="86" y="452">Typed programs</text>
<text class="detail" x="86" y="483">Clojure S-expressions</text>
<text class="detail" x="86" y="512">Each individual is an algorithm</text>

<text class="detail" x="517" y="528" text-anchor="middle" style="fill:#e4faf3">Propose</text>
<text class="detail" x="517" y="551" text-anchor="middle" style="fill:#e4faf3">solution</text>
<rect x="612" y="503" width="150" height="63" rx="7" fill="#173832" stroke="#376d62"/>
<text class="detail" x="687" y="528" text-anchor="middle" style="fill:#e4faf3">Score</text>
<text class="detail" x="687" y="551" text-anchor="middle" style="fill:#e4faf3">objectives</text>
<rect x="782" y="503" width="150" height="63" rx="7" fill="#173832" stroke="#376d62"/>
<text class="detail" x="857" y="528" text-anchor="middle" style="fill:#e4faf3">Update</text>
<text class="detail" x="857" y="551" text-anchor="middle" style="fill:#e4faf3">Pareto archive</text>
<text class="small solution" x="687" y="614" text-anchor="middle">Repeat within the solution budget</text>
<text class="small" x="687" y="638" text-anchor="middle">Output: a set of nondominated trade-offs</text>

<!-- Outer assessment and variation. -->
<rect x="610" y="706" width="346" height="108" rx="11" fill="#201d36" stroke="#a48bd4" stroke-width="1.4"/>
<text class="node-title" x="632" y="744">Assess the optimizer</text>
<text class="detail" x="632" y="776">Frontier quality + program size</text>
<text class="small" x="632" y="800">Across training tasks and seeds</text>
<rect x="64" y="706" width="292" height="108" rx="11" fill="#201d36" stroke="#a48bd4" stroke-width="1.4"/>
<text class="node-title" x="86" y="744">Select + vary</text>
<text class="detail" x="86" y="776">Mutation / typed crossover</text>
<text class="small" x="86" y="800">Keep valid, bounded programs</text>

<!-- One-way transition to validation and a locked test. -->
<path class="arrow" d="M210 842V910" stroke="#e5bd7c" marker-end="url(#amber-arrow)"/>
<text class="small check" x="232" y="879">Training finalists leave the evolutionary loop</text>
<rect x="40" y="914" width="284" height="111" rx="11" fill="#29241e" stroke="#ae8c5a" stroke-width="1.4"/>
<text class="node-title" x="62" y="953" style="font-size:22px">Select on validation</text>
<text class="detail" x="62" y="983">One representative program</text>
<text class="small" x="62" y="1009">from every outer run</text>
<path class="arrow" d="M325 968H364" stroke="#e5bd7c" marker-end="url(#amber-arrow)"/>
<rect x="368" y="914" width="284" height="111" rx="11" fill="#29241e" stroke="#ae8c5a" stroke-width="1.4"/>
<text class="node-title" x="390" y="953" style="font-size:22px">Freeze the program</text>
<text class="detail" x="390" y="983">Lock code and configuration</text>
<text class="small" x="390" y="1009">No further learning</text>
<path class="arrow" d="M653 968H692" stroke="#e5bd7c" marker-end="url(#amber-arrow)"/>
<rect x="696" y="914" width="284" height="111" rx="11" fill="#29241e" stroke="#ae8c5a" stroke-width="1.4"/>
<text class="node-title" x="718" y="953" style="font-size:22px">Test unseen tasks</text>
<text class="detail" x="718" y="983">Quality · time · failures</text>
<text class="small" x="718" y="1009">No test feedback into training</text>

<!-- Benchmark comparison. -->
<path class="arrow" d="M838 1025V1045H510V1065" stroke="#8fa0ba" marker-end="url(#gray-arrow)"/>
<rect x="40" y="1069" width="940" height="112" rx="11" fill="#141e30" stroke="#46556e" stroke-width="1.4"/>
<text class="eyebrow" x="64" y="1099" fill="#d1dbeb">COMPARE UNDER THE SAME RESOURCE CONTRACT</text>
<text class="detail" x="64" y="1129">Random DSL · mutation-only · scoring-only · configured conventional solvers</text>
<text class="small" x="64" y="1157">Exact small references check correctness; report offline design cost separately.</text>
<path class="arrow" d="M510 1181V1210" stroke="#8fa0ba" marker-end="url(#gray-arrow)"/>

<!-- Intended output, not a declaration of a successful experiment. -->
<rect x="40" y="1214" width="940" height="84" rx="11" fill="#1e1a30" stroke="#8c74b8" stroke-width="1.4"/>
<text class="node-title" x="64" y="1248" style="font-size:24px">Aim: compact optimizer programs + defensible evidence</text>
<text class="small" x="64" y="1278">A negative result is valid. Better historical optimization does not guarantee profit.</text>
